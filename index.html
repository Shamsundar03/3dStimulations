<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Black & Transparent Glassmorphism - SmartBoard Science & Math</title>

  <!-- Google Fonts & Material Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />

  <!-- Sketchfab Viewer API -->
  <script type="text/javascript" src="https://static.sketchfab.com/api/sketchfab-viewer-1.12.1.js"></script>

  <style>
    /* Dark Transparent Variables from Code 1 */
    :root {
      --glass-bg: transparent; 
      --glass-hover: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.15);
      --glass-border-light: rgba(255, 255, 255, 0.25);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-pill: 50px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    /* Pure Black Background */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #000000;
      color: var(--text-main);
      overflow: hidden;
      position: relative;
    }

    /* WebKit Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }

    /* Main App Container */
    .app-container {
      display: flex;
      gap: 20px;
      width: 96vw;
      height: 92vh;
      max-width: 1600px;
      z-index: 10;
    }

    /* Glass Effect Utility Class */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-top: 1px solid var(--glass-border-light);
      border-left: 1px solid var(--glass-border-light);
      box-shadow: var(--shadow-glass);
      border-radius: var(--radius-lg);
    }

    /* SIDEBAR */
    .side-panel {
      width: 300px; 
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .side-panel.closed {
      width: 0;
      border: none;
      opacity: 0;
      margin-left: -20px; /* pull back gap */
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 24px;
      font-weight: 600;
      font-size: 1.4rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      /* Brand gradient style from Code 2 adapted for glass */
      background: linear-gradient(135deg, #a5b4fc, #ffffff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Glass Tabs */
    .tabs {
      display: flex;
      padding: 16px;
      gap: 8px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid transparent;
      padding: 12px 4px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.8rem;
      border-radius: var(--radius-md);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease;
    }

    .tab-btn:hover {
      background: var(--glass-hover);
      color: var(--text-main);
    }

    .tab-btn.active {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--glass-border);
    }

    /* Glass Search Box with Button */
    .search-box {
      padding: 0 16px 16px 16px;
      display: flex;
      gap: 8px;
    }

    .search-input-wrapper {
      position: relative;
      flex: 1;
    }

    .search-input-wrapper .material-symbols-outlined {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-main);
    }

    .search-box input {
      width: 100%;
      padding: 12px 16px 12px 44px;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-pill);
      color: var(--text-main);
      outline: none;
      font-size: 0.9rem;
      transition: all 0.3s;
    }

    .search-box input::placeholder {
      color: rgba(255, 255, 255, 0.4);
    }

    .search-box input:focus {
      background: var(--glass-hover);
      border-color: rgba(255, 255, 255, 0.5);
    }
    
    .search-box input:-webkit-autofill,
    .search-box input:-webkit-autofill:hover, 
    .search-box input:-webkit-autofill:focus, 
    .search-box input:-webkit-autofill:active {
        -webkit-box-shadow: 0 0 0 30px #050505 inset !important;
        -webkit-text-fill-color: var(--text-main) !important;
        transition: background-color 5000s ease-in-out 0s;
        caret-color: white;
    }

    /* Simulation Tree */
    .sim-tree {
      flex: 1;
      overflow-y: auto;
      padding: 0 16px 20px 16px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,0.2) transparent;
    }

    .subject-header {
      padding: 14px 18px;
      background: transparent;
      margin-top: 8px;
      border-radius: var(--radius-md);
      cursor: pointer;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.15);
      transition: all 0.3s;
    }

    .subject-header:hover {
      background: var(--glass-hover);
      border-color: rgba(255, 255, 255, 0.3);
    }

    /* Adapted for Code 2's deep nested levels */
    .class-header {
      padding: 10px 16px 10px 24px;
      color: rgba(255, 255, 255, 0.85);
      background: transparent;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: background-color 0.2s;
    }

    .class-header:hover {
      background: var(--glass-hover);
      border-radius: 8px;
    }

    .chapter-title {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.5);
      margin: 12px 0 6px 16px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .sim-item {
      padding: 10px 16px 10px 24px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      cursor: pointer;
      border-radius: var(--radius-md);
      transition: all 0.3s;
      margin-bottom: 4px;
      position: relative;
    }

    .sim-item::before {
      content: '';
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 4px;
      height: 4px;
      background-color: rgba(255,255,255,0.3);
      border-radius: 50%;
      transition: background-color 0.2s;
    }

    .sim-item:hover {
      background: var(--glass-hover);
      color: #fff;
      transform: translateX(4px);
    }

    .sim-item:hover::before {
      background-color: #fff;
    }

    /* 3D Models Grid */
    .sketchfab-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      padding-top: 10px;
    }

    .sketchfab-card {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-md);
      overflow: hidden;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      transition: all 0.3s;
    }

    .sketchfab-card:hover {
      background: var(--glass-hover);
      transform: translateY(-5px);
      border-color: rgba(255, 255, 255, 0.4);
    }

    .sketchfab-card img {
      width: 100%;
      height: 100px;
      object-fit: cover;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .sketchfab-card h4 {
      font-size: 0.75rem;
      padding: 12px;
      margin: 0;
      color: #fff;
      text-align: center;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MAIN STAGE */
    .board-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      transition: all 0.3s;
    }

    /* Glass Top Toolbar */
    .toolbar-glass {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: transparent;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 10px 24px;
      border-radius: var(--radius-pill);
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 100;
    }

    .toolbar-glass .sim-title {
      font-weight: 500;
      font-size: 0.8rem; 
      color: rgba(255, 255, 255, 0.85); 
      display: flex;
      align-items: center;
      gap: 6px; 
    }

    /* Fully Transparent Button */
    .btn-glass {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 6px 16px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.3s;
      font-size: 0.85rem;
    }

    .btn-glass:hover {
      background: var(--glass-hover);
      border-color: rgba(255, 255, 255, 0.6);
    }

    .whiteboard-placeholder {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      text-align: center;
      padding: 20px;
    }

    .whiteboard-placeholder .material-symbols-outlined {
      font-size: 5rem;
      margin-bottom: 20px;
      opacity: 0.5;
    }

    .whiteboard-placeholder h2 {
      font-weight: 500;
      font-size: 1.8rem;
    }

    .whiteboard-placeholder p {
      margin-top: 10px;
      opacity: 0.6;
      font-weight: 300;
      max-width: 400px;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: var(--radius-lg);
      background: #151515; 
    }

    .hidden {
      display: none !important;
    }

    /* Loading Spinner */
    .loader-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px;
      color: rgba(255,255,255,0.7);
      font-size: 0.9rem;
    }
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top: 3px solid var(--text-main);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .app-container {
        flex-direction: column;
        width: 100vw;
        height: 100vh;
        padding: 10px;
        border-radius: 0;
      }
      .side-panel {
        width: 100%;
        height: 40vh;
        flex-shrink: 0;
      }
      .side-panel.closed {
        height: 0;
        width: 100%;
        margin: 0;
      }
      .board-area {
        flex: 1;
        width: 100%;
      }
      .toolbar-glass {
        width: 90%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- GLASS SIDEBAR -->
    <div class="side-panel glass" id="sidePanel">
      <div class="brand">
        <span class="material-symbols-outlined">cast_for_education</span>
        OpenX
      </div>

      <!-- Glass Tabs -->
      <div class="tabs">
        <button class="tab-btn active" id="tab-3d" onclick="switchMode('3d')" aria-label="3D Models Tab">
          <span class="material-symbols-outlined">view_in_ar</span>
          3D Models
        </button>
        <button class="tab-btn" id="tab-phet" onclick="switchMode('phet')" aria-label="2D PhET Tab">
          <span class="material-symbols-outlined">science</span>
          2D PhET
        </button>
        <button class="tab-btn" id="tab-videos" onclick="switchMode('videos')" aria-label="Videos Tab">
          <span class="material-symbols-outlined">smart_display</span>
          Videos
        </button>
        <button class="tab-btn" id="tab-ebooks" onclick="switchMode('ebooks')" aria-label="e-Books Tab">
          <span class="material-symbols-outlined">menu_book</span>
          e-Books
        </button>
      </div>

      <div class="search-box">
        <div class="search-input-wrapper">
          <span class="material-symbols-outlined">search</span>
          <!-- Removed oninput so search happens on button click -->
          <input type="text" id="searchInput" placeholder="Search 3D models (e.g. Heart)..." aria-label="Search Input" />
        </div>
        <!-- Transparent Search Button -->
        <button id="searchBtn" class="btn-glass" onclick="handleSearchClick()" aria-label="Execute Search" style="padding: 0 14px;">
          <span class="material-symbols-outlined" style="font-size: 1.2rem;">arrow_forward</span>
        </button>
      </div>

      <div class="sim-tree" id="simTree">
        <!-- Dynamically injected via JavaScript -->
      </div>
    </div>

    <!-- GLASS MAIN STAGE -->
    <div class="board-area glass">
      
      <!-- Glass Toolbar -->
      <div class="toolbar-glass">
        <!-- Sidebar Toggle from Code 2 integrated into Glass UI -->
        <button class="btn-glass" onclick="toggleSidebar()" aria-label="Toggle Sidebar" title="Toggle Sidebar" style="padding: 6px 10px;">
          <span class="material-symbols-outlined" style="font-size: 1.2rem;">menu_open</span>
        </button>
        
        <span id="active-sim-title" class="sim-title">
          <span class="material-symbols-outlined" style="font-size: 1rem;">info</span>
          No simulation loaded
        </span>

        <div id="sketchfabControls" class="model-controls hidden" style="margin-left: 12px; padding-left: 12px; border-left: 1px solid rgba(255,255,255,0.2);">
          <button class="btn-glass" onclick="toggleAnimation()" id="toggleAnimBtn" aria-label="Pause Animation">
            <span class="material-symbols-outlined" id="animIcon" style="font-size: 1.2rem;">pause</span> 
            <span id="animText">Pause</span>
          </button>
        </div>
      </div>

      <div id="whiteboardPlaceholder" class="whiteboard-placeholder">
        <span class="material-symbols-outlined">interactive_space</span>
        <h2>Ready to Explore</h2>
        <p>Select a 3D model, simulation, video, or e-book from the panel to project it onto the SmartBoard.</p>
      </div>

      <iframe id="phetIframe" class="hidden" allow="fullscreen; autoplay; xr-spatial-tracking" allowfullscreen title="Content Viewer"></iframe>
    </div>

  </div>

    function renderDefault3DModels() {
      const container = document.getElementById("simTree");
      container.innerHTML = ''; 
      
      const grid = document.createElement('div');
      grid.className = 'sketchfab-grid';

      default3DModels.forEach(model => {
        const card = document.createElement('div');
        card.className = 'sketchfab-card';
        card.title = model.name;
        card.onclick = () => loadSketchfabModel(model.name, model.uid);

        card.innerHTML = `
          <img src="${model.thumbUrl}" alt="${model.name}" loading="lazy">
          <h4>${model.name}</h4>
        `;
        grid.appendChild(card);
      });

      container.appendChild(grid);
    }

    let currentMode = '3d'; 
    let viewerAPI = null;   
    let isPlaying = true;

    function switchMode(mode) {
      currentMode = mode;

      ['3d', 'phet', 'videos', 'ebooks'].forEach(m => {
        document.getElementById(`tab-${m}`).classList.toggle('active', mode === m);
      });

      const searchInput = document.getElementById('searchInput');
      const searchBtn = document.getElementById('searchBtn');

      searchInput.value = "";
      searchBtn.classList.remove('hidden');

      if (mode === '3d') {
        searchInput.placeholder = "Search 3D models (e.g. Heart)...";
        searchBtn.innerHTML = `<span class="material-symbols-outlined" style="font-size: 1.2rem;">arrow_forward</span>`;
        renderDefault3DModels(); 
      } else if (mode === 'videos') {
        searchInput.placeholder = "Search any video online";
        searchBtn.innerHTML = `<span class="material-symbols-outlined" style="font-size: 1.2rem; color: #3b82f6;">play_circle</span>`;
        renderTree();
      } else {
        searchInput.placeholder = `Search ${mode === 'phet' ? 'PhET simulations' : 'e-Books'}...`;
        searchBtn.innerHTML = `<span class="material-symbols-outlined" style="font-size: 1.2rem;">arrow_forward</span>`;
        renderTree();
      }
    }

    document.getElementById('searchInput').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        handleSearchClick();
      }
    });

    function handleSearchClick() {
      const query = document.getElementById('searchInput').value.trim();
      
      if (currentMode === '3d') {
        performSketchfabSearch(query);
      } else if (currentMode === 'videos') {
        performYouTubeSearch(query);
      } else {
        // PhET & e-Books local search
        filterSimulations();
      }
    }

    // Expanding folder logic for local search
    function filterSimulations() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const items = document.querySelectorAll(".sim-item");
      
      items.forEach(item => {
        const text = item.innerText.toLowerCase();
        if (text.includes(query)) {
          item.classList.remove("hidden");
          // Expand parent folders automatically so they can be seen
          let parent = item.parentElement;
          while (parent && parent.id !== "simTree") {
            if (parent.classList.contains("hidden")) {
              parent.classList.remove("hidden");
              // Toggle the icon of the parent's header
              if (parent.previousElementSibling && parent.previousElementSibling.querySelector('.material-symbols-outlined')) {
                 parent.previousElementSibling.querySelector('.material-symbols-outlined').innerText = "expand_less";
              }
            }
            parent = parent.parentElement;
          }
        } else {
          item.classList.add("hidden");
        }
      });
    }

          simEl.innerHTML = `
            <img src="${thumbUrl}" alt="Thumbnail" style="width: 60px; height: 45px; object-fit: cover; border-radius: 4px; border: 1px solid rgba(255,255,255,0.2);">
            <div style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: normal; line-height: 1.2;">${title}</div>
          `;

          simEl.onclick = () => loadSimulation(title, `https://www.youtube.com/embed/${videoId}`, false);
          container.appendChild(simEl);
        });
      } catch (error) {
        container.innerHTML = `<p style="text-align: center; color: #ff9999; padding: 20px;">Failed to search YouTube. Check Console.</p>`;
        console.error(error);
      }
    }

    function renderTree() {
      const container = document.getElementById("simTree");
      container.innerHTML = "";

      let activeData;
      if (currentMode === 'phet') activeData = phetData;
      else if (currentMode === 'videos') activeData = videoData;
      else if (currentMode === 'ebooks') activeData = eBooksData;
      else return;

      for (const [subjKey, subject] of Object.entries(activeData)) {
        // 1. Top Level Header
        const subjHeader = document.createElement("div");
        subjHeader.className = "subject-header";
        subjHeader.innerHTML = `<span>${subject.title}</span> <span class="material-symbols-outlined" style="font-size: 1.2rem;">expand_more</span>`;

        const subjContent = document.createElement("div");
        subjContent.id = `subj-${subjKey}`;
        subjContent.classList.add("hidden");

        subjHeader.onclick = () => {
          subjContent.classList.toggle("hidden");
          const icon = subjHeader.querySelector('.material-symbols-outlined');
          icon.innerText = subjContent.classList.contains("hidden") ? "expand_more" : "expand_less";
        };

        container.appendChild(subjHeader);
        container.appendChild(subjContent);

        // 2. Standard 2-Level Render (for PhET / eBooks)
        if (subject.chapters) {
          for (const [chapterName, sims] of Object.entries(subject.chapters)) {
            appendChapterUI(subjContent, chapterName, sims, false);
          }
        }

        // 3. Nested Classes (3 or 4-level deep, from Code 2)
        if (subject.classes) {
          for (const [className, subjectsObj] of Object.entries(subject.classes)) {
            // Level 2: The Class (e.g., "Class 10", "Physics")
            const classHeader = document.createElement("div");
            classHeader.className = "class-header";
            classHeader.innerHTML = `<span>${className}</span> <span class="material-symbols-outlined" style="font-size: 1.1rem;">chevron_right</span>`;
            
            const classContent = document.createElement("div");
            classContent.classList.add("hidden");

            classHeader.onclick = () => {
              classContent.classList.toggle("hidden");
              const icon = classHeader.querySelector('.material-symbols-outlined');
              icon.innerText = classContent.classList.contains("hidden") ? "expand_more" : "chevron_right";
            };

            subjContent.appendChild(classHeader);
            subjContent.appendChild(classContent);

            // Level 3: Handle direct arrays OR objects
            if (Array.isArray(subjectsObj)) {
               subjectsObj.forEach(item => {
                 const simEl = document.createElement("div");
                 simEl.className = "sim-item";
                 simEl.innerText = item.name;
                 simEl.style.paddingLeft = "40px";
                 simEl.onclick = () => loadSimulation(item.name, item.url, item.external);
                 classContent.appendChild(simEl);
               });
            } else {
              for (const [subjName, subjectContent] of Object.entries(subjectsObj)) {
                const subjectSubHeader = document.createElement("div");
                subjectSubHeader.className = "class-header";
                subjectSubHeader.style.paddingLeft = "32px";
                subjectSubHeader.style.backgroundColor = "transparent";
                subjectSubHeader.style.borderBottom = "none";
                subjectSubHeader.innerHTML = `<span>${subjName}</span> <span class="material-symbols-outlined" style="font-size: 0.9rem;">chevron_right</span>`;
                
                const subjectSubContent = document.createElement("div");
                subjectSubContent.classList.add("hidden");

                subjectSubHeader.onclick = () => {
                  subjectSubContent.classList.toggle("hidden");
                  const icon = subjectSubHeader.querySelector('.material-symbols-outlined');
                  icon.innerText = subjectSubContent.classList.contains("hidden") ? "expand_more" : "chevron_right";
                };

                classContent.appendChild(subjectSubHeader);
                classContent.appendChild(subjectSubContent);

                // Check if it's an array of videos OR an object containing chapters
                if (Array.isArray(subjectContent)) {
                  if(subjectContent.length > 0 && subjectContent[0].topics) {
                      subjectContent.forEach(chapter => {
                          const chapterHeader = document.createElement("div");
                          chapterHeader.className = "class-header";
                          chapterHeader.style.paddingLeft = "48px";
                          chapterHeader.style.backgroundColor = "transparent";
                          chapterHeader.style.borderBottom = "none";
                          chapterHeader.innerHTML = `<span>${chapter.name}</span> <span class="material-symbols-outlined" style="font-size: 0.8rem;">chevron_right</span>`;
                          
                          const chapterContent = document.createElement("div");
                          chapterContent.classList.add("hidden");

                          chapterHeader.onclick = () => {
                              chapterContent.classList.toggle("hidden");
                              const icon = chapterHeader.querySelector('.material-symbols-outlined');
                              icon.innerText = chapterContent.classList.contains("hidden") ? "expand_more" : "chevron_right";
                          };

                          subjectSubContent.appendChild(chapterHeader);
                          subjectSubContent.appendChild(chapterContent);

                          chapter.topics.forEach(topic => {
                              const simEl = document.createElement("div");
                              simEl.className = "sim-item";
                              simEl.innerText = topic.name;
                              simEl.style.paddingLeft = "64px";
                              simEl.onclick = () => loadSimulation(topic.name, topic.url, topic.external);
                              chapterContent.appendChild(simEl);
                          });
                      });
                  } else {
                      // Level 4: The Actual Videos (direct flat array)
                      if (subjectContent.length === 0) {
                          const emptyEl = document.createElement("div");
                          emptyEl.className = "sim-item";
                          emptyEl.innerText = "Coming Soon...";
                          emptyEl.style.cursor = "default";
                          emptyEl.style.opacity = "0.5";
                          emptyEl.style.paddingLeft = "48px";
                          subjectSubContent.appendChild(emptyEl);
                      } else {
                          subjectContent.forEach(item => {
                          const simEl = document.createElement("div");
                          simEl.className = "sim-item";
                          simEl.innerText = item.name;
                          simEl.style.paddingLeft = "48px";
                          simEl.onclick = () => loadSimulation(item.name, item.url, item.external);
                          subjectSubContent.appendChild(simEl);
                          });
                      }
                  }
                } else if (typeof subjectContent === 'object') {
                    for (const [chapterName, videos] of Object.entries(subjectContent)) {
                          const chapterHeader = document.createElement("div");
                          chapterHeader.className = "class-header";
                          chapterHeader.style.paddingLeft = "48px";
                          chapterHeader.style.backgroundColor = "transparent";
                          chapterHeader.style.borderBottom = "none";
                          chapterHeader.innerHTML = `<span>${chapterName}</span> <span class="material-symbols-outlined" style="font-size: 0.8rem;">chevron_right</span>`;
                          
                          const chapterContent = document.createElement("div");
                          chapterContent.classList.add("hidden");

                          chapterHeader.onclick = () => {
                              chapterContent.classList.toggle("hidden");
                              const icon = chapterHeader.querySelector('.material-symbols-outlined');
                              icon.innerText = chapterContent.classList.contains("hidden") ? "expand_more" : "chevron_right";
                          };

                          subjectSubContent.appendChild(chapterHeader);
                          subjectSubContent.appendChild(chapterContent);

                          videos.forEach(item => {
                              const simEl = document.createElement("div");
                              simEl.className = "sim-item";
                              simEl.innerText = item.name;
                              simEl.style.paddingLeft = "64px";
                              simEl.onclick = () => loadSimulation(item.name, item.url, item.external);
                              chapterContent.appendChild(simEl);
                          });
                    }
                }
              }
            }
          }
        }
      }
    }

    function appendChapterUI(parentContainer, title, items, isDeep = false) {
      const chapTitle = document.createElement("div");
      chapTitle.className = "chapter-title";
      if(isDeep) chapTitle.style.marginLeft = "24px";
      chapTitle.innerText = title;
      parentContainer.appendChild(chapTitle);

      if (items.length === 0) {
        const emptyEl = document.createElement("div");
        emptyEl.className = "sim-item";
        emptyEl.innerText = "Coming Soon...";
        emptyEl.style.cursor = "default";
        emptyEl.style.opacity = "0.5";
        if(isDeep) emptyEl.style.paddingLeft = "40px";
        parentContainer.appendChild(emptyEl);
      } else {
        items.forEach(item => {
          const simEl = document.createElement("div");
          simEl.className = "sim-item";
          simEl.innerText = item.name;
          if(isDeep) {
             simEl.style.paddingLeft = "40px";
          }
          simEl.onclick = () => loadSimulation(item.name, item.url, item.external);
          parentContainer.appendChild(simEl);
        });
      }
    }

    async function performSketchfabSearch(query) {
      const container = document.getElementById("simTree");

      if (!query) {
        renderDefault3DModels(); 
        return;
      }

      container.innerHTML = `
        <div class="loader-container">
          <div class="loader"></div>
          <p>Searching Sketchfab...</p>
        </div>
      `;

      try {
        const response = await fetch(`https://api.sketchfab.com/v3/search?type=models&q=${encodeURIComponent(query)}`);
        const data = await response.json();
        container.innerHTML = '';

        if (!data.results || data.results.length === 0) {
          container.innerHTML = `<p style="text-align: center; color: rgba(255,255,255,0.7); padding: 20px;">No 3D models found for "${query}".</p>`;
          return;
        }

        const grid = document.createElement('div');
        grid.className = 'sketchfab-grid';

        data.results.forEach(model => {
          const thumbUrl = model.thumbnails?.images?.find(img => img.width >= 200)?.url || model.thumbnails?.images?.[0]?.url || '';
          const card = document.createElement('div');
          card.className = 'sketchfab-card';
          card.title = model.name;
          card.onclick = () => loadSketchfabModel(model.name, model.uid);
          card.innerHTML = `
            <img src="${thumbUrl}" alt="${model.name}" loading="lazy">
            <h4>${model.name}</h4>
          `;
          grid.appendChild(card);
        });
        container.appendChild(grid);
      } catch (error) {
        container.innerHTML = '<p style="text-align: center; color: #ff9999; padding: 20px;">Failed to load models.</p>';
      }
    }

    function loadSketchfabModel(name, uid) {
      const iframe = document.getElementById("phetIframe");
      const placeholder = document.getElementById("whiteboardPlaceholder");
      const titleSpan = document.getElementById("active-sim-title");
      const modelControls = document.getElementById("sketchfabControls");

      placeholder.classList.add("hidden");
      iframe.classList.remove("hidden");
      
      titleSpan.innerHTML = `<span class="material-symbols-outlined" style="font-size: 1rem;">3d_rotation</span> ${name}`;
      modelControls.classList.remove("hidden");

      isPlaying = true;
      document.getElementById('animIcon').innerText = 'pause';
      document.getElementById('animText').innerText = 'Pause';
      document.getElementById('toggleAnimBtn').setAttribute('aria-label', 'Pause Animation');

      viewerAPI = null;
      const client = new Sketchfab('1.12.1', iframe);
      client.init(uid, {
        autostart: 1,
        ui_theme: 'dark',
        transparent: 1, 
        success: function onSuccess(api) {
          viewerAPI = api;
          api.start();
        }
      });
    }

    function toggleAnimation() {
      if (!viewerAPI) return;
      const icon = document.getElementById('animIcon');
      const text = document.getElementById('animText');
      const btn = document.getElementById('toggleAnimBtn');
      
      if (isPlaying) {
        viewerAPI.pause();
        icon.innerText = 'play_arrow';
        text.innerText = 'Play';
        btn.setAttribute('aria-label', 'Play Animation');
      } else {
        viewerAPI.play();
        icon.innerText = 'pause';
        text.innerText = 'Pause';
        btn.setAttribute('aria-label', 'Pause Animation');
      }
      isPlaying = !isPlaying;
    }

    function toggleSidebar() {
      document.getElementById("sidePanel").classList.toggle("closed");
    }

    function loadSimulation(name, url, external = false) {
      if (external) {
        window.open(url, '_blank');
        return;
      }
      
      document.getElementById("sketchfabControls").classList.add("hidden");
      viewerAPI = null;

      const iframe = document.getElementById("phetIframe");
      const placeholder = document.getElementById("whiteboardPlaceholder");
      const titleSpan = document.getElementById("active-sim-title");

      iframe.src = url;
      iframe.classList.remove("hidden");
      placeholder.classList.add("hidden");
      
      let icon = "science";
      if(currentMode === "videos") icon = "play_circle";
      if(currentMode === "ebooks") icon = "library_books";
      
      titleSpan.innerHTML = `<span class="material-symbols-outlined" style="font-size: 1rem;">${icon}</span> ${name}`;
    }

    // Init
    renderDefault3DModels();

  </script>
</body>
